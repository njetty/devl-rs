[package]
name = "devl-server"
description = "Streaming contract, session coordinator, and WebSocket and HTTP adapters for DEVL servers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["asr", "speech-recognition", "streaming", "devl"]
categories = ["multimedia::audio", "network-programming"]
# Unpublished until endpoint adapters land; the release workflow publishes the
# three existing crates only.
publish = false

[features]
default = ["mock"]
# Deterministic `MockBackend` for the local `devl-server` binary and CI smoke tests.
mock = ["devl-core/test-utils"]
# Local Whisper and Qwen3-ASR backends for the `devl-server` binary and the
# opt-in real-model smoke test. Not needed by the library.
candle = [
    "dep:devl-candle",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]

[dependencies]
devl-core.workspace = true
devl-candle = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { version = "0.23", optional = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tungstenite.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util.workspace = true
tokio.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["http1", "client", "server"] }
http-body-util.workspace = true
devl-core = { workspace = true, features = ["test-utils"] }

[[bin]]
name = "devl-server"
path = "src/bin/devl-server/main.rs"

[[example]]
name = "stream_client"

[[test]]
name = "real_model_smoke"
required-features = ["candle"]

[lints]
workspace = true
