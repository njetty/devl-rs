[package]
name = "devl-candle"
description = "Candle inference backend for devl-rs (Whisper on CPU, Metal, and CUDA)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["asr", "whisper", "candle", "streaming", "devl"]
categories = ["algorithms", "multimedia::audio"]

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
devl-core.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
thiserror.workspace = true
serde_json = "1"

[dev-dependencies]
devl-core = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]
